name: Build & Push writer image

# Builds the writer image and pushes to GHCR. Same trigger shape as
# mxl-dmf-demo-app's compositor build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR cannot rename a package: ghcr.io/qvest-digital/mxl-dmf-writer keeps the
  # tags it already holds and receives no further build.
  IMAGE: ghcr.io/qvest-digital/dmf-mf-mxl-writer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: tags
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ steps.tags.outputs.version || steps.tags.outputs.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          # Loaded as well, so the SBOM below describes the image this build
          # produced, on pull requests too.
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.version && format('{0}:{1}', env.IMAGE, steps.tags.outputs.version) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned by commit: a tag of a third-party action can be moved.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2

      # The image is catalogued once. The vulnerability report, the SPDX copy
      # and the gate below are all derived from this one CycloneDX SBOM, so
      # what a finding was matched against is the file that is kept.
      #
      # What is built from source (in go-mxl libmxl, libfabric, rdma-core
      # and the vcpkg ports; here the patched mxl tools, libmxl-monitoring
      # and opentelemetry-cpp; NvNmos and its conan packages) is recorded by
      # no package manager, so Trivy cannot see it. The image carries it as
      # CycloneDX fragments under /opt/*/share/sbom/, and their components
      # are merged in here by bom-ref, since Trivy reads the conan entries
      # of the NvNmos fragment itself but drops their recipe revision and
      # homepage: on a shared bom-ref the fragment's fields win and the
      # properties of both are kept. Every fragment is required by name,
      # so losing one fails the step; the glob still picks up any added
      # later.
      - name: Generate SBOM and vulnerability report
        env:
          REF: ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
        run: |
          set -o pipefail
          trivy image --quiet --format cyclonedx --output sbom.trivy.json "$REF"
          { cat sbom.trivy.json
            docker run --rm --entrypoint sh "$REF" -c '
              test -f /opt/libfabric/share/sbom/libfabric-stack.cdx.json &&
              test -f /opt/libmxl/share/sbom/libmxl.cdx.json &&
              test -f /opt/nvnmos/share/sbom/nvnmos.cdx.json &&
              test -f /opt/mxl-writer/share/sbom/mxl-writer.cdx.json &&
              test -f /opt/mxl-writer/share/sbom/opentelemetry-cpp.cdx.json &&
              cat /opt/*/share/sbom/*.cdx.json'
          } | jq -s '.[0].components = ([.[].components[]] | group_by(.["bom-ref"] // tojson)
              | map(reduce .[] as $c ({}; . + $c + {properties: ((.properties // []) + ($c.properties // []) | unique)})
                | if .properties == [] then del(.properties) else . end)) | .[0]' > sbom.cdx.json
          trivy sbom --quiet --format spdx-json --output sbom.spdx.json sbom.cdx.json
          trivy sbom --quiet --format json --output report.json sbom.cdx.json
          # What the gate below sees, and what .trivyignore.yaml accepts.
          # report.json keeps every finding regardless.
          {
            echo '### Trivy: fixable HIGH and CRITICAL'
            echo '```'
            trivy sbom --quiet --format table --severity HIGH,CRITICAL \
              --ignore-unfixed --ignorefile .trivyignore.yaml --show-suppressed \
              sbom.cdx.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM and report
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.tags.outputs.sha }}
          path: |
            sbom.cdx.json
            sbom.spdx.json
            report.json

      - name: Set up ORAS
        if: github.event_name != 'pull_request'
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6

      # Stored beside the image in GHCR as an OCI referrer, so the SBOM of a
      # published tag outlives the workflow artifact's retention.
      - name: Attach SBOM to the image
        if: github.event_name != 'pull_request'
        env:
          SUBJECT: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          oras attach --artifact-type application/vnd.cyclonedx+json \
            "$SUBJECT" sbom.cdx.json:application/vnd.cyclonedx+json

      # Last, so a finding fails the job without holding back the push: the
      # fix for a base image CVE usually lies in a rebuild of go-mxl-runtime,
      # not here. A finding accepted in .trivyignore.yaml does not fail it.
      - name: Fail on fixable HIGH and CRITICAL
        run: |
          trivy sbom --quiet --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --exit-code 1 sbom.cdx.json
